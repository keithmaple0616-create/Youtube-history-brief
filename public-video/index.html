<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频生产工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Video Production Desk</p>
          <h1>视频生产工作台</h1>
          <p class="subhead">完整文案 -> 分镜节奏/素材提示词 -> 素材回填 -> MiniMax 配音并生成完整视频</p>
        </div>
        <div class="guardrail">
          主流程只有四步。素材版权仍需人工确认；AI 图只能作为插图，不能当新闻证据或档案证据。
        </div>
      </section>

      <section class="workspace">
        <aside class="panel setup-panel">
          <div class="panel-title">
            <span>项目设置</span>
            <button id="refreshProjects" class="icon-button" title="刷新项目">↻</button>
          </div>
          <label>
            项目名
            <input id="title" value="Trump China Nixon Reversal" />
          </label>
          <label>
            视频类型
            <select id="lane">
              <option value="history">history</option>
              <option value="finance">finance</option>
              <option value="tech">tech</option>
              <option value="geopolitical">geopolitical</option>
            </select>
          </label>
          <label>
            目标版本
            <select id="targetVersion">
              <option value="full-video">12-15 分钟完整长视频</option>
              <option value="review-sample">60-90 秒样片</option>
            </select>
          </label>
          <div class="divider"></div>
          <button id="createProject" class="primary">新建项目</button>
          <button id="loadSample" class="secondary">填入现有 Trump/Nixon 项目稿</button>

          <div class="divider"></div>
          <h2>已有项目</h2>
          <div id="projectList" class="project-list"></div>

        </aside>

        <section class="main-panel">
          <div class="script-panel">
            <div class="panel-title">
              <span>正式脚本</span>
              <span id="scriptStats" class="muted">0 chars</span>
            </div>
            <textarea id="scriptText" spellcheck="false" placeholder="粘贴完整正式文案。工具会先分析文案，再生成分镜节奏、搜索素材清单和 image2 生图提示词。"></textarea>
          </div>

          <div class="actions">
            <button id="generatePlan" class="primary" disabled>1 分析文案并生成分镜</button>
            <button id="saveIntake" class="secondary" disabled>2 保存素材回填</button>
            <button id="finalVideo" class="secondary" disabled>3 生成完整视频</button>
            <button id="checkAssets" class="secondary" disabled>检查素材</button>
            <a id="videoLink" class="link-button disabled" target="_blank" rel="noreferrer">打开视频</a>
          </div>

          <section class="status-grid">
            <div class="metric">
              <span>当前项目</span>
              <strong id="currentProject">未创建</strong>
            </div>
            <div class="metric">
              <span>分镜</span>
              <strong id="evidenceMetric">--</strong>
            </div>
            <div class="metric">
              <span>素材任务</span>
              <strong id="diagramMetric">--</strong>
            </div>
            <div class="metric">
              <span>视频状态</span>
              <strong id="pptMetric">--</strong>
            </div>
          </section>

          <section class="intake-panel">
            <div class="panel-title">
              <span>素材回填</span>
              <span class="muted">把你找到的素材路径、source URL、license 填进这里</span>
            </div>
            <textarea id="assetIntakeText" spellcheck="false" placeholder="生成分镜后，这里会出现 asset-intake.json。"></textarea>
          </section>

          <section class="output-panel">
            <nav class="tabs" aria-label="输出文件">
              <button class="tab active" data-tab="summary">分镜总览</button>
              <button class="tab" data-tab="storyboard">分段结构</button>
              <button class="tab" data-tab="external">搜索素材</button>
              <button class="tab" data-tab="image2">image2</button>
              <button class="tab" data-tab="assets">素材回填</button>
            </nav>
            <div class="output-toolbar">
              <button id="copyOutput" class="secondary">复制当前内容</button>
              <span id="statusLine" class="muted">等待创建项目</span>
            </div>
            <div id="summaryView" class="tab-view active"></div>
            <pre id="textView" class="tab-view text-output"></pre>
          </section>
        </section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
